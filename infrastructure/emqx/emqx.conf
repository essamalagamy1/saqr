## Rased — EMQX Configuration

node {
  name = "rased@127.0.0.1"
  cookie = "rasedemqxsecretcookie"
  data_dir = "data"
}

## Authentication — allow anonymous for development
authorization {
  no_match = allow
  deny_action = disconnect
  cache {
    enable = true
    max_size = 1024
    ttl = 1m
  }
}

authentication = [
  {
    mechanism = password_based
    backend = built_in_database
    enable = false
  }
]

## MQTT Listener
listeners.tcp.default {
  bind = "0.0.0.0:1883"
  max_connections = 1000
  proxy_protocol = false
}

## WebSocket Listener
listeners.ws.default {
  bind = "0.0.0.0:8083"
  max_connections = 1000
  websocket {
    mqtt_path = "/mqtt"
  }
}

## Dashboard
dashboard {
  listeners.http {
    bind = 18083
  }
}

## MQTT Protocol settings
mqtt {
  max_packet_size = 1MB
  max_clientid_len = 256
  max_topic_levels = 128
  max_qos_allowed = 2
  max_topic_alias = 65535
  retain_available = true
}

## System monitoring
sysmon {
  os {
    cpu_check_interval = 60s
    cpu_high_watermark = 80%
    cpu_low_watermark = 60%
  }
}

log {
  console {
    level = warning
  }
}
